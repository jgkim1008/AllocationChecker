name: DCA Preclose Overseas Cron

on:
  # schedule 비활성화 (2026-07-24): 로컬 PC crontab으로 전환. 필요 시 아래 주석 해제.
  # schedule:
  #   - cron: '30 19 * * 0-4'  # KST 04:30 (EDT, 여름) — 실제 발동 요일은 월~금(UTC 일~목 기준)
  #   - cron: '30 20 * * 0-4'  # KST 05:30 (EST, 겨울) — 동일
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger DCA preclose overseas
        run: |
          response=$(curl -sL -o /dev/null -w "%{http_code}" \
            -X GET "${{ vars.NEXT_PUBLIC_APP_URL }}/api/auto-trade/dca/cron/preclose?market=overseas" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "Response: $response"
          if [ "$response" != "200" ]; then
            echo "Cron failed with status $response"
            exit 1
          fi
